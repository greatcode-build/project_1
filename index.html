<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonsai</title>
  </head>

  <body>
    <style>
      button {
        height: 6rem;
        width: 12rem;
        border: 2px black dotted;
        margin: 2rem;
        padding: 2rem;
        border-radius: 2rem;
        cursor: pointer;
      }

      .red {
        background-color: red;
      }
      .blue {
        background-color: blue;
      }
      .green {
        background-color: green;
      }

      button:hover {
        height: 6.5rem;
        width: 12.5rem;
        opacity: 70%;
      }

      button:active {
        opacity: 80%;
      }
      /* #btn-1 {
        background-color: red;
      } */
    </style>

    <button class="red" id="btn-1">Red</button>
    <button class="blue" id="btn-2">Green</button>
    <button class="green" id="btn-3">Blue</button>
  </body>
</html>
